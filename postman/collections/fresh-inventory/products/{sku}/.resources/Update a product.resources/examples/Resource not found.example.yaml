$kind: http-example
id: fcdbc933-ce26-4501-a9e8-35b0c4375689
request:
  url: "{{baseUrl}}/products/:sku"
  method: PATCH
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: sku
      value: sku-101
      description: Unique product identifier
  body:
    type: json
    content: |-
      {
        "status": "active",
        "name": "Widget Prime",
        "quantity": 42,
        "warehouseId": "wh-west-1",
        "unitPrice": 49.99
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "not_found",
        "message": "The requested resource was not found",
        "requestId": "req-9f2a"
      }
order: 3000
