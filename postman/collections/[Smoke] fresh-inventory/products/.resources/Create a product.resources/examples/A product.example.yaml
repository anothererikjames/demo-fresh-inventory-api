request:
  url: "{{baseUrl}}/products"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "name": "Widget Prime",
        "quantity": 42,
        "warehouseId": "wh-west-1",
        "status": "active",
        "unitPrice": 49.99
      }
