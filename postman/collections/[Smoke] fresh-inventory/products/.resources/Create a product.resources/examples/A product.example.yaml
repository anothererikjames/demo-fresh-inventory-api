        "name": "Widget Prime",
        "quantity": 42,
        "warehouseId": "wh-west-1",
        "createdAt": "2026-07-16T20:00:00Z",
        "updatedAt": "2026-07-16T20:00:00Z",
        "unitPrice": 49.99
      }
